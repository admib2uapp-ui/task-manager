[project]
name = "orbit-backend"
version = "0.1.0"
description = "Orbit — project management platform API (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # flake8-simplify
]
ignore = ["B008"] # FastAPI uses function calls (Depends) as defaults

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
